spring:
  application:
    name: musicly-backend
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=10m,recordStats
  devtools:
    add-properties: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

springdoc:
  api-docs:
    path: /openapi
    enabled: false
  swagger-ui:
    path: /swagger-ui
    enabled: false

security:
  jwt:
    secret: change-me-to-a-32-byte-minimum-secret-please
    issuer: musicly-backend
    access-token-ttl: PT12H
  bootstrap-admin:
    email: admin@musicly.local
    password: change-this-admin-password
    display-name: Super Admin
