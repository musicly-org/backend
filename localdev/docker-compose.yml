name: musicly

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: musicly
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d musicly"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
