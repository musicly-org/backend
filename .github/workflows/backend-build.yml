name: Backend Build

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-build:
    name: backend-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build backend
        run: ./gradlew build --no-daemon
